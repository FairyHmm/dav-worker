# Bundled default used when the consent screen's locationsConfigPath is
# left blank. Temporary: once arbitrary per-user config paths are the
# only supported mode, this file (and the fallback in index.ts) goes away.
# See src/packages/files/locations/src/files.toml for the real config
# shape reference.

[aliases]
vault = "/Obsidian"
projects = "@vault/Projects"

[hosts]
"@projects/OSS" = ["dav-worker"]

[patterns]
"*/spec" = "*/Docs/SPEC.md"
"*/code" = "*/Code"
