# Bundled default used when the consent screen's config path is left
# blank. Temporary: once arbitrary per-user config paths are the only
# supported mode, this file (and the fallback in index.ts) goes away.
[preferences]

[locations]
[locations.aliases]
vault = "/Obsidian"
projects = "@vault/Projects"

[locations.hosts]
"@projects/OSS" = ["dav-worker"]

[locations.patterns]
"*/spec" = "*/Docs/SPEC.md"
"*/code" = "*/Code"

[calendars]
work = ["work", "#3B82F6"]
personal = ["personal", "#22C55E"]
